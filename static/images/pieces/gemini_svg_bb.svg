<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 -20 180 260" width="100%" height="100%">
    <defs>
        <!-- Background Gradients & Patterns -->
        <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#404040"/>
            <stop offset="100%" stop-color="#151515"/>
        </linearGradient>
        <pattern id="checker" width="80" height="80" patternUnits="userSpaceOnUse">
            <rect width="80" height="80" fill="#333333" opacity="0.3"/>
            <rect width="40" height="40" fill="#222222" opacity="0.3"/>
            <rect x="40" y="40" width="40" height="40" fill="#222222" opacity="0.3"/>
        </pattern>

        <!-- Piece Material Gradients (Simulating 3D Cylindrical Lighting) -->
        <linearGradient id="blackGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#1a1a1a"/>
            <stop offset="15%" stop-color="#4a4a4a"/>
            <stop offset="45%" stop-color="#111111"/>
            <stop offset="85%" stop-color="#3a3a3a"/>
            <stop offset="100%" stop-color="#050505"/>
        </linearGradient>
        
        <linearGradient id="whiteGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c8c8c8"/>
            <stop offset="15%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#d0d0d0"/>
            <stop offset="85%" stop-color="#fdfdfd"/>
            <stop offset="100%" stop-color="#a0a0a0"/>
        </linearGradient>

        <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#555555"/>
            <stop offset="20%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#888888"/>
            <stop offset="80%" stop-color="#eeeeee"/>
            <stop offset="100%" stop-color="#333333"/>
        </linearGradient>

        <linearGradient id="darkTrimGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#111111"/>
            <stop offset="20%" stop-color="#666666"/>
            <stop offset="50%" stop-color="#1a1a1a"/>
            <stop offset="80%" stop-color="#444444"/>
            <stop offset="100%" stop-color="#050505"/>
        </linearGradient>

        <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
        </filter>
    </defs>
    <style>
        .text-header { font-family: 'Cinzel', 'Times New Roman', serif; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
        .text-sub { font-family: 'Cinzel', 'Times New Roman', serif; fill: #aaaaaa; text-anchor: middle; letter-spacing: 3px; font-size: 14px; }
        .text-label { font-family: 'Cinzel', 'Times New Roman', serif; fill: #dddddd; text-anchor: middle; letter-spacing: 2px; font-size: 18px; }
        
        .shadow { fill: rgba(0,0,0,0.65); filter: url(#shadowBlur); }
        
        .black-body { fill: url(#blackGrad); stroke: #000000; stroke-width: 1px; }
        .silver-trim { fill: url(#silverGrad); stroke: #ffffff; stroke-width: 0.5px; }
        
        .white-body { fill: url(#whiteGrad); stroke: #666666; stroke-width: 1px; }
        .dark-trim { fill: url(#darkTrimGrad); stroke: #000000; stroke-width: 0.5px; }
        
        .divider { stroke: #555555; stroke-width: 1px; opacity: 0.5; }
    </style>
    <g transform="translate(-600, -110)">
    <g transform="translate(600, 110)">
        <ellipse cx="100" cy="235" rx="70" ry="12" class="shadow"/>
        <!-- Base -->
        <path class="black-body" d="M 35 230 L 165 230 L 165 215 L 35 215 Z"/>
        <path class="silver-trim" d="M 40 215 L 160 215 L 160 210 L 40 210 Z"/>
        <path class="black-body" d="M 45 210 C 45 190 60 180 100 180 C 140 180 155 190 155 210 Z"/>
        <path class="silver-trim" d="M 62 180 L 138 180 L 138 172 L 62 172 Z"/>
        <!-- Body -->
        <path class="black-body" d="M 70 172 C 70 110 85 90 100 90 C 115 90 130 110 130 172 Z"/>
        <path class="silver-trim" d="M 75 90 L 125 90 L 125 82 L 75 82 Z"/>
        <!-- Cabeza del alfil (Ajustada: menos redonda, más cónica) -->
        <path class="black-body" d="M 77 82 C 77 55 85 35 100 35 C 115 35 123 55 123 82 Z"/>
        <!-- Slit & Top -->
        <path class="silver-trim" d="M 115 45 L 95 72 L 90 68 L 110 41 Z"/>
        <path class="silver-trim" d="M 95 35 L 105 35 L 105 32 L 95 32 Z"/>
        <circle cx="100" cy="24" r="8" class="black-body"/>
        
    </g>
    </g>
</svg>