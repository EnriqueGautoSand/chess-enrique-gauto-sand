        <path class="dark-trim" d="M 72 75 L 128 75 L 128 67 L 72 67 Z"/>
        <path class="white-body" d="M 75 67 L 125 67 L 130 52 L 70 52 Z"/>
        <path class="dark-trim" d="M 65 52 L 135 52 L 135 46 L 65 46 Z"/>
