        <path class="silver-trim" d="M 40 215 L 160 215 L 160 210 L 40 210 Z"/>
        <path class="black-body" d="M 45 210 C 45 190 60 180 100 180 C 140 180 155 190 155 210 Z"/>
        <path class="silver-trim" d="M 62 180 L 138 180 L 138 172 L 62 172 Z"/>
        <!-- Body -->
        <path class="black-body" d="M 65 172 C 65 100 80 75 100 75 C 120 75 135 100 135 172 Z"/>
        <path class="silver-trim" d="M 70 75 L 130 75 L 130 67 L 70 67 Z"/>
        <path class="black-body" d="M 72 67 L 128 67 L 138 47 L 62 47 Z"/>
        <path class="silver-trim" d="M 60 47 L 140 47 L 140 40 L 60 40 Z"/>
        <path class="black-body" d="M 62 40 L 138 40 L 125 30 L 75 30 Z"/>
        <!-- Cross -->
