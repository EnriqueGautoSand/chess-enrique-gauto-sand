        <path class="black-body" d="M 92 25 L 108 25 L 102 12 L 118 12 L 118 -2 L 102 -2 L 108 -15 L 92 -15 L 98 -2 L 82 -2 L 82 12 L 98 12 Z"/>
        <text x="100" y="280" class="text-label">KING</text>
    </g>

